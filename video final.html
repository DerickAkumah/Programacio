<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Video Final - ¡Has Escapado!</title>
    <!-- Importamos la fuente retro -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: 'Press Start 2P', cursive;
        }

        /* Contenedor del video */
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: opacity 1s ease;
        }

        /* Cuadro de fin de juego estilo Retro */
        #endScreenBox {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: none; /* Se activa con JS al terminar el video */
            text-align: center;
            background-color: rgba(10, 10, 10, 0.9); 
            padding: 40px;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(39, 174, 96, 0.5);
            border: 4px solid #27ae60;
            width: 80%;
            max-width: 600px;
        }

        #endScreenBox h1 {
            color: #ffffff;
            font-size: 1.8rem;
            margin-bottom: 25px;
            text-transform: uppercase;
            text-shadow: 3px 3px #27ae60; 
            line-height: 1.4;
        }

        #endScreenBox p {
            color: #2ecc71;
            font-size: 0.8rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Botones Estilo Retro */
        .retroBtn {
            margin: 10px;
            padding: 15px 30px;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            cursor: pointer;
            color: white;
            border: none;
            text-transform: uppercase;
            box-shadow: 0 6px 0 #1e8449, 0 10px 15px rgba(0,0,0,0.5);
            transition: all 0.1s;
            display: inline-block;
            text-decoration: none;
        }

        .btn-green {
            background-color: #27ae60;
        }

        .btn-green:hover {
            background-color: #2ecc71;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #27ae60, 0 12px 18px rgba(0,0,0,0.6);
        }

        .retroBtn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1e8449;
        }

    </style>
</head>
<body>

    <div id="video-container">
        <!-- He mantenido tu ruta de video: images/Video Final.mp4 -->
        <video id="finalVideo" autoplay>
            <source src="images/Video Final.mp4" type="video/mp4">
            Tu navegador no soporta el vídeo.
        </video>
    </div>

    <!-- Cuadro que aparece al final -->
    <div id="endScreenBox">
        <h1>¡HAS ESCAPAT!</h1>
        <p>Felicitats, has superat l'aventura.</p>
        
        <a href="index.html" class="retroBtn btn-green">⬅ Torna a jugar</a>
    </div>

    <script>
        const video = document.getElementById('finalVideo');
        const endScreen = document.getElementById('endScreenBox');

        // Cuando el video termina...
        video.onended = function() {
            // Bajamos la opacidad del video para que se vea el menú
            video.style.opacity = "0.3"; 
            
            // Mostramos el cuadro de victoria
            endScreen.style.display = 'block';
        };
    </script>

</body>
</html>
